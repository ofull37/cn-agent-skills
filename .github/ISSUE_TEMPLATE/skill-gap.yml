name: 技能缺口
description: 当技能的指导有误、过时或在你的项目中不适用时，提交此报告。
title: "[skill-gap]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        当技能给出了错误、过时或与生态不匹配的指导时，请使用此表单。
        回答尽量简短——提供足够让维护者分拣的上下文，而不是长篇描述。

  - type: dropdown
    id: skill
    attributes:
      label: 受影响的技能
      description: 哪个技能没有按预期工作？
      options:
        - api-and-interface-design
        - browser-testing-with-devtools
        - ci-cd-and-automation
        - code-review-and-quality
        - code-simplification
        - context-engineering
        - debugging-and-error-recovery
        - deprecation-and-migration
        - documentation-and-adrs
        - doubt-driven-development
        - frontend-ui-engineering
        - git-workflow-and-versioning
        - idea-refine
        - incremental-implementation
        - interview-me
        - observability-and-instrumentation
        - performance-optimization
        - planning-and-task-breakdown
        - security-and-hardening
        - shipping-and-launch
        - source-driven-development
        - spec-driven-development
        - test-driven-development
        - using-agent-skills
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: excerpt
    attributes:
      label: 相关说明或摘录
      description: 粘贴 SKILL.md（或链接的参考资料）中误导了 agent 或不适用的那一行或简短段落。
      placeholder: 例如：验证清单要求运行 `npm test`
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 项目背景
      description: 语言、构建工具、测试运行器，或其他此处重要的约定。
      placeholder: 例如：Java 21、Maven、JUnit 5
    validations:
      required: true

  - type: textarea
    id: what-failed
    attributes:
      label: 哪些没有生效或不适用
      description: 当 agent 遵循该技能时发生了什么？哪些是错误或无关的？
      placeholder: 例如：agent 在 Maven 仓库里坚持用 npm 脚本，但这里没有 package.json
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 你实际是怎么做的
      description: 你（或 agent）是如何解除阻塞的？可选，但非常有帮助。
      placeholder: 例如：让 agent 使用 `./mvnw test`，并忽略 npm 清单
    validations:
      required: false
